import org.apache.tools.ant.filters.ReplaceTokens

// Skript for Minecraft 1.7.10 (Crucible / Thermos / KCauldron) running on Java 21.
//
// This build compiles directly against the Bukkit 1.7.10 API, so anything that compiles here
// is guaranteed to link on a 1.7.10 server. Features that don't exist on 1.7.10 were removed
// rather than guarded at runtime.

plugins {
	id 'com.gradleup.shadow' version '8.3.8'
	id 'maven-publish'
	id 'java'
}

java {
	// The server runs on Java 21, but Java 8 bytecode keeps the jar usable on
	// Crucible setups that still run Java 8.
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 8
	options.compilerArgs += ['-Xlint:-options']
}

repositories {
	mavenCentral()
	maven { url = 'https://jitpack.io' } // Bukkit 1.7.10 API and Vault
}

configurations {
	shade
	implementation.extendsFrom shade
}

dependencies {
	// Final Bukkit API commit (1.7.10-R0.1-SNAPSHOT), built by JitPack from github.com/Bukkit/Bukkit
	compileOnly 'com.github.Bukkit:Bukkit:f210234'

	// Not provided by 1.7.10 servers (CraftBukkit 1.7.10 relocates its own copy), so it is shaded
	shade 'com.google.code.gson:gson:2.10.1'

	compileOnly 'org.eclipse.jdt:org.eclipse.jdt.annotation:2.2.700'
	compileOnly 'org.jetbrains:annotations:24.0.1'
	compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
	compileOnly 'com.google.code.findbugs:annotations:3.0.1'
	compileOnly('com.github.MilkBowl:VaultAPI:1.7.1') {
		transitive = false
	}
	compileOnly fileTree(dir: 'lib', include: '*.jar')
}

processResources {
	filter ReplaceTokens, tokens: [
		'version'         : project.property('version'),
		'today'           : 'unknown', // Don't leak information about system this was built on
		'release-flavor'  : 'selfbuilt-unknown', // Note: 'selfbuilt' prefix makes updater report a custom build
		'release-channel' : 'none', // No updates, so anything else wouldn't make sense
		'release-updater' : 'ch.njol.skript.update.NoUpdateChecker', // Disable update checking
		'release-source'  : '',
		'release-download': 'null'
	]
}

shadowJar {
	archiveFileName = project.property('jarName')
	configurations = [project.configurations.shade]
	relocate 'com.google.gson', 'ch.njol.skript.libs.gson'
	exclude 'META-INF/versions/**'
	exclude 'module-info.class'
	manifest {
		attributes(
			'Name': 'ch/njol/skript',
			'Automatic-Module-Name': 'ch.njol.skript'
		)
	}
	from('skript-aliases') {
		into 'aliases-english' // Change this if we get aliases in other languages
	}
}

jar {
	archiveClassifier = 'plain'
}

tasks.named('build') {
	dependsOn shadowJar
}

tasks.register('sourceJar', Jar) {
	from sourceSets.main.allJava
	archiveClassifier = 'sources'
}

publishing {
	publications {
		maven(MavenPublication) {
			groupId = 'com.github.SkriptLang'
			artifactId = 'Skript'
			version = project.version
			artifact tasks.sourceJar
			artifact tasks.shadowJar
		}
	}
}

// The upstream test suite targets Paper test servers and cannot run against 1.7.10.
tasks.named('compileTestJava') { enabled = false }
tasks.named('test') { enabled = false }
