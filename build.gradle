import org.apache.tools.ant.filters.ReplaceTokens

plugins {
	id 'java'
}

group = project.property('groupid')
version = project.property('version')

repositories {
	mavenCentral()

	maven {
		url = 'https://repo.papermc.io/repository/maven-public/'
	}

	maven {
		url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
	}

	maven {
		url = 'https://maven.enginehub.org/repo/'
	}

	maven {
		url = 'https://jitpack.io'
	}
}

// Skript is a plugin: the server provides the Bukkit API and every hooked plugin,
// so nothing below ends up inside the jar.
dependencies {
	compileOnly 'com.destroystokyo.paper:paper-api:1.12.1-R0.1-SNAPSHOT'
	compileOnly 'org.eclipse.jdt:org.eclipse.jdt.annotation:1.1.0'
	compileOnly 'com.google.code.findbugs:findbugs:2.0.3'
	compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
	compileOnly 'com.googlecode.json-simple:json-simple:1.1.1'
	compileOnly 'org.mozilla:rhino:1.7.7.2'

	// Classes the JDK 8 runtime ships but newer JDKs do not; needed to compile on JDK 9+.
	compileOnly 'javax.xml.bind:jaxb-api:2.3.1'
	compileOnly 'javax.xml.soap:javax.xml.soap-api:1.4.0'

	// Hooked plugins: only the plugin jar itself is needed to compile against.
	compileOnly('com.sk89q.worldguard:worldguard-legacy:6.2') { transitive = false }
	compileOnly('com.sk89q.worldedit:worldedit-bukkit:6.1.4') { transitive = false }
	compileOnly('com.sk89q.worldedit:worldedit-core:6.1') { transitive = false }
	compileOnly('com.github.MilkBowl:Vault:1.7.3') { transitive = false }
	compileOnly('com.github.marcelo-mason:PreciousStones:24e3d4bf67b7240ae36b32be10e99d4091938c5c') { transitive = false }

	compileOnly fileTree(dir: 'lib', include: '*.jar')

	testImplementation 'junit:junit:4.12'
	testImplementation 'org.easymock:easymock:3.4'
	testImplementation 'com.destroystokyo.paper:paper-api:1.12.1-R0.1-SNAPSHOT'
	testImplementation 'org.eclipse.jdt:org.eclipse.jdt.annotation:1.1.0'
	testImplementation 'com.google.code.findbugs:jsr305:3.0.2'
}

configurations.all {
	resolutionStrategy.dependencySubstitution {
		substitute module('org.bukkit:bukkit') using module('com.destroystokyo.paper:paper-api:1.11.2-R0.1-SNAPSHOT')
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	// The Crucible (Forge 1.7.10) server runs on Java 8, so the bytecode must stay Java 8
	// even when Gradle itself runs on a newer JDK.
	options.release = 8
}

processResources {
	filter ReplaceTokens, tokens: [
		"version": System.getenv('SKRIPT_VERSION') == null ? project.property('version') : System.getenv('SKRIPT_VERSION')
	]
}

jar {
	archiveFileName = System.getenv('SKRIPT_JAR_NAME') == null ? project.property('jarName') : System.getenv('SKRIPT_JAR_NAME')

	manifest {
		attributes("Name": "ch/njol/skript",
				"Sealed": "true")
	}
}
